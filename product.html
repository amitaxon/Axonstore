<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AXON Product Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #f7f7f7;
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      padding: 20px;
      max-width: 1400px;
      margin: auto;
      gap: 20px;
    }

    #productDetails {
      flex: 1 1 60%;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    #relatedProductsContainer {
      flex: 1 1 35%;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .product-box {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .product-box img {
      flex: 1 1 300px;
      max-width: 100%;
      border-radius: 8px;
      object-fit: cover;
    }

    .product-box .details {
      flex: 1 1 300px;
    }

    .product-box h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .product-box p.price {
      font-size: 20px;
      font-weight: bold;
      color: #111;
      margin-bottom: 10px;
    }

    .product-box p.desc {
      font-size: 16px;
      color: #444;
      margin-bottom: 20px;
    }

    .button-row {
      display: flex;
      gap: 10px;
    }

    .button-row button {
      flex: 1;
      padding: 12px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
    }

    #addToCartBtn {
      background: #000;
      color: #fff;
    }

    #addToWishlistBtn {
      background: transparent;
      border: 2px solid #000;
      color: #000;
    }

    #buyNowBtn {
      background: #007bff;
      color: #fff;
    }

    #relatedProductsContainer h2 {
      margin-bottom: 10px;
      font-size: 22px;
    }

    #relatedProducts {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
    }

    .related-card {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      text-align: center;
      text-decoration: none;
      color: inherit;
    }

    .related-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .related-card h3 {
      font-size: 16px;
      margin: 0;
    }

    .related-card p {
      font-size: 14px;
      color: #333;
      margin-top: 4px;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }

      #productDetails,
      #relatedProductsContainer {
        flex: 1 1 100%;
      }

      .related-card img {
        height: 120px;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Product Detail -->
    <div id="productDetails"></div>

    <!-- Related Products -->
    <div id="relatedProductsContainer">
      <h2>Related Products</h2>
      <div id="relatedProducts"></div>
    </div>
  </div>

  <script src="product.js"></script>

  <script>
    // Wait for the page to load
    window.addEventListener("DOMContentLoaded", () => {
      const buyNowBtn = document.getElementById("buyNowBtn");

      if (buyNowBtn) {
        buyNowBtn.addEventListener("click", () => {
          const product = {
            id: selectedProduct.id,
            title: selectedProduct.title,
            price: selectedProduct.price,
            quantity: 1
          };

          localStorage.setItem("buyNowProduct", JSON.stringify(product));
          window.location.href = "checkout.html";
        });
      }
    });
  </script>
</body>
</html>
