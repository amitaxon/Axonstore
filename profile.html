<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profile Page</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
      text-align: center;
    }

    /* Header without flex */
    .header {
      background-color: #000;
      color: white;
      padding: 15px 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .profile-icon {
      color: white;
      font-size: 28px;
      float: right;
      margin-top: -28px;
    }

    /* Profile picture circle style */
    .profile-picture-wrapper {
      margin: 20px auto;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid grey;
      position: relative;
    }

    .profile-picture-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-picture-wrapper input[type="file"] {
      display: none;
    }

    .profile-container {
      margin-top: 20px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .profile-container input,
    .profile-container select {
      width: 95%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .profile-container button {
      width: 100%;
      padding: 12px;
      background-color: white-smoke;
      color: black;
      border: 1px solid grey;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .logout-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px; /* space between icon and text */
  margin: 20px auto;
  padding: 12px 20px;
  background-color: whitesmoke;
  color: black;
  border: 1px solid gray;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  width: 100%;
  
}

.logout-btn i.material-icons {
  font-size: 20px;
  vertical-align: middle;
}  </style>
</head>
<body>

  <!-- Profile Picture Upload -->
  <div class="profile-picture-wrapper">
    <label for="profileImageInput">
      <img id="profilePic" src="https://via.placeholder.com/150" alt="Profile Picture">
    </label>
    <input type="file" id="profileImageInput" accept="image/*">
  </div>

  <!-- Profile Info -->
  <div class="profile-container">
    <h2>User Profile</h2>

    <input type="text" id="profileName" placeholder="Full Name">
    <input type="email" id="profileEmail" placeholder="Email">
    <input type="text" id="profileAddress" placeholder="Address">
    <input type="password" id="profilePassword" placeholder="Change Password">

    <div id="profileOptions"></div>
          

    <button id="updateProfileBtn">Update Profile</button>
  </div>
  <div>
    <button class="logout-btn" onclick="logout()">
        <i class="material-icons">logout</i>Logout</button>
  </div>
  
  <script>
    // Logout
    function logout() {
      window.location.href = "login.html";
    }

    // Profile Image Upload
    const profileImageInput = document.getElementById('profileImageInput');
    const profilePic = document.getElementById('profilePic');

    profileImageInput.addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          profilePic.src = e.target.result;
          localStorage.setItem('profileImage', e.target.result);
        };
        reader.readAsDataURL(file);
      }
    });

    // Save profile data
    document.getElementById('updateProfileBtn').addEventListener('click', () => {
      const name = document.getElementById('profileName').value;
      const email = document.getElementById('profileEmail').value;
      const address = document.getElementById('profileAddress').value;
      const password = document.getElementById('profilePassword').value;
      const option = document.getElementById('profileOptions').value;

      const profileData = {
        name,
        email,
        address,
        password,
        option
      };

      localStorage.setItem('userProfile', JSON.stringify(profileData));
      alert('Profile updated successfully!');
    });

    // Load saved profile data on page load
    window.addEventListener('load', () => {
      const savedData = JSON.parse(localStorage.getItem('userProfile'));
      const savedImage = localStorage.getItem('profileImage');

      if (savedData) {
        document.getElementById('profileName').value = savedData.name || '';
        document.getElementById('profileEmail').value = savedData.email || '';
        document.getElementById('profileAddress').value = savedData.address || '';
        document.getElementById('profilePassword').value = savedData.password || '';
        document.getElementById('profileOptions').value = savedData.option || '';
      }

      if (savedImage) {
        profilePic.src = savedImage;
      }
    });
  </script>
</body>
</html>
